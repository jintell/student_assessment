name: Platform CI

on:
  workflow_call:
    secrets:
      ARCHITECTURE_REPOSITORY_TOKEN:
        required: true
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checkout-provenance:
    name: checkout-provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Import trusted GitHub signing key
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_FINGERPRINT="968479A1AFF927E37D1A566BB5690EEEBB952194"

          mkdir -p "$HOME/.gnupg"
          chmod 700 "$HOME/.gnupg"

          gpg --batch --import ci/keys/github-web-flow.gpg

          ACTUAL_FINGERPRINT="$(
            gpg --batch \
                --with-colons \
                --fingerprint B5690EEEBB952194 \
              | awk -F: '$1 == "fpr" { print $10; exit }'
          )"

          if [[ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]]; then
            echo "::error::Unexpected GitHub signing-key fingerprint"
            echo "Expected: $EXPECTED_FINGERPRINT"
            echo "Actual:   $ACTUAL_FINGERPRINT"
            exit 1
          fi

          echo "Trusted GitHub signing key imported successfully."

      - name: Run CI Stage 1
        run: ci/stage-1

  build:
    name: build
    needs: checkout-provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - run: ci/stage-2

  static-analysis:
    name: static-analysis
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install documentation-conformance tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install --yes ripgrep

          command -v rg >/dev/null 2>&1 || {
            echo "::error::Required command 'rg' is unavailable"
            exit 1
          }

          echo "Using $(rg --version | head -n 1)"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - run: ci/stage-3

  stage-4a:
    name: stage-4a
    needs: static-analysis
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      failing_rule: ${{ steps.stage.outputs.failing_rule }}
      failure_reason: ${{ steps.stage.outputs.failure_reason }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout ratified architecture baseline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: jintell/sap_design
          path: architecture-baseline
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.ARCHITECTURE_REPOSITORY_TOKEN }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Run and retain Stage 4a
        id: stage
        shell: bash
        run: |
          set -uo pipefail

          LIVE_DIR="build/reports/stage-4a/live"
          SELF_TEST_DIR="build/reports/stage-4a/self-test"

          mkdir -p "${LIVE_DIR}" "${SELF_TEST_DIR}"

          printf 'started_at=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            > "${SELF_TEST_DIR}/run-metadata.txt"

          set +e
          ./gradlew --no-daemon --console=plain ciStage4a 2>&1 \
            | tee "${LIVE_DIR}/run.log"
          STAGE_STATUS="${PIPESTATUS[0]}"
          set -e

          cp "${LIVE_DIR}/run.log" "${SELF_TEST_DIR}/run.log"
          printf '%s\n' "${STAGE_STATUS}" > "${SELF_TEST_DIR}/exit-code.txt"

          shasum -a 256 "${LIVE_DIR}/run.log" \
            > "${LIVE_DIR}/checksums.sha256"

          FAILURE_REASON="$(
            awk '
              /^Step [0-9]+:/ { print; exit }
              /architecture-ratification.json was not found/ { print; exit }
            ' "${LIVE_DIR}/run.log"
          )"

          FAILING_RULE="$(
            sed -nE 's/^Step ([0-9]+):.*/Stage 4a step \1/p' \
              <<<"${FAILURE_REASON}"
          )"

          if [[ "${STAGE_STATUS}" -eq 0 ]]; then
            FAILURE_REASON="Stage 4a passed."
            FAILING_RULE="none"
          else
            FAILURE_REASON="${FAILURE_REASON:-Stage 4a failed before a gate reason was emitted.}"
            FAILING_RULE="${FAILING_RULE:-Stage 4a ratification contract}"
          fi

          echo "failing_rule=${FAILING_RULE}" >> "${GITHUB_OUTPUT}"
          echo "failure_reason=${FAILURE_REASON}" >> "${GITHUB_OUTPUT}"

          exit "${STAGE_STATUS}"
        env:
          ARCHITECTURE_REPOSITORY: ${{ github.workspace }}/architecture-baseline
      - name: Retain Stage 4a self-test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stage-4a-self-test-result
          path: build/reports/stage-4a/self-test/**
          if-no-files-found: error
          retention-days: 90
      - name: Retain green Stage 4a ratification evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stage-4a-live-ratification
          path: build/reports/stage-4a/live/**
          if-no-files-found: error
          retention-days: 90

  postgresql-baseline:
    name: postgresql-baseline
    needs: stage-4a
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_DB: cbt_platform
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: cbt_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username cbt_platform --dbname cbt_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Install ripgrep tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install --yes ripgrep

          command -v rg >/dev/null 2>&1 || {
            echo "::error::Required command 'rg' is unavailable"
            exit 1
          }

          echo "Using $(rg --version | head -n 1)"

      - name: Verify approved PostgreSQL baseline and behavior
        run: ./gradlew --no-daemon --console=plain verifyPostgresqlBaseline

  arch-conformance:
    name: arch-conformance
    needs:
      - stage-4a
      - postgresql-baseline
    runs-on: ubuntu-latest
    outputs:
      failing_rule: ${{ steps.stage.outputs.failing_rule }}
      failure_reason: ${{ steps.stage.outputs.failure_reason }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Run architecture conformance
        id: stage
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build/reports/conformance-notification

          set +e
          ci/stage-4 2>&1 \
            | tee build/reports/conformance-notification/run.log
          STAGE_STATUS="${PIPESTATUS[0]}"
          set -e

          FAILURE_REASON="$(
            awk '
              /R[1-8].*violated:/ {
                sub(/^[[:space:]]*/, "")
                print
                exit
              }
              /^FAILURE: Build failed/ { print; exit }
            ' build/reports/conformance-notification/run.log
          )"
          FAILING_RULE="$(
            sed -nE 's/.*(R[1-8]).*/\1/p' <<<"${FAILURE_REASON}"
          )"
          if [[ "${STAGE_STATUS}" -eq 0 ]]; then
            FAILURE_REASON="Architecture conformance passed."
            FAILING_RULE="none"
          else
            FAILURE_REASON="${FAILURE_REASON:-Architecture conformance failed before a rule diagnostic was emitted.}"
            FAILING_RULE="${FAILING_RULE:-architecture conformance}"
          fi
          echo "failing_rule=${FAILING_RULE}" >> "${GITHUB_OUTPUT}"
          echo "failure_reason=${FAILURE_REASON}" >> "${GITHUB_OUTPUT}"
          exit "${STAGE_STATUS}"

  engineering-notification:
    name: engineering-notification
    needs: [stage-4a, arch-conformance]
    if: >-
      ${{ always() && !cancelled() &&
          (needs.stage-4a.result == 'failure' || needs.arch-conformance.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish blocking failure to the engineering channel
        shell: bash
        env:
          STAGE_4A_RESULT: ${{ needs.stage-4a.result }}
          STAGE_4A_RULE: ${{ needs.stage-4a.outputs.failing_rule }}
          STAGE_4A_REASON: ${{ needs.stage-4a.outputs.failure_reason }}
          CONFORMANCE_RULE: ${{ needs.arch-conformance.outputs.failing_rule }}
          CONFORMANCE_REASON: ${{ needs.arch-conformance.outputs.failure_reason }}
        run: |
          set -euo pipefail

          if [[ "${STAGE_4A_RESULT}" == "failure" ]]; then
            STAGE="stage-4a"
            FAILING_RULE="${STAGE_4A_RULE:-Stage 4a ratification contract}"
            FAILURE_REASON="${STAGE_4A_REASON:-Stage 4a failed before a gate reason was emitted.}"
          else
            STAGE="arch-conformance"
            FAILING_RULE="${CONFORMANCE_RULE:-architecture conformance}"
            FAILURE_REASON="${CONFORMANCE_REASON:-Architecture conformance failed before a rule diagnostic was emitted.}"
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "::error title=CI BLOCK ${STAGE} ${FAILING_RULE}::${FAILURE_REASON}"
          {
            echo "# Blocking architecture failure"
            echo
            echo "- Stage: \`${STAGE}\`"
            echo "- Failing rule: \`${FAILING_RULE}\`"
            echo "- First-failure reason: ${FAILURE_REASON}"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Ref: \`${GITHUB_REF}\`"
            echo "- Run: ${RUN_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"

  unit-tests:
    name: unit-tests
    needs: arch-conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - run: ci/stage-5

  slice-tests:
    name: slice-tests
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - run: ci/stage-7

  docs-conformance:
    name: docs-conformance
    needs: slice-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      # Create the evidence location FIRST.
      # This guarantees upload-artifact always has at least one file,
      # even if a later checkout/setup step fails.
      - name: Initialize documentation-conformance evidence
        shell: bash
        run: |
          set -euo pipefail

          REPORT_DIR="${RUNNER_TEMP}/documentation-conformance-self-test"

          rm -rf "${REPORT_DIR}"
          mkdir -p "${REPORT_DIR}"

          {
            echo "stage=documentation-conformance"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo "started_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > "${REPORT_DIR}/run-metadata.txt"

          test -s "${REPORT_DIR}/run-metadata.txt"

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Checkout ratified architecture baseline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: jintell/sap_design
          path: architecture-baseline
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.ARCHITECTURE_REPOSITORY_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Install documentation-conformance tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install --yes ripgrep

          command -v rg >/dev/null 2>&1 || {
            echo "::error::Required command 'rg' is unavailable"
            exit 1
          }

          echo "Using $(rg --version | head -n 1)"

      - name: Run documentation conformance
        shell: bash
        env:
          ARCHITECTURE_REPOSITORY: ${{ github.workspace }}/architecture-baseline
        run: |
          set -uo pipefail

          REPORT_DIR="${RUNNER_TEMP}/documentation-conformance-self-test"

          echo "Running CI Stage 13..."

          set +e

          ci/stage-13 2>&1 \
            | tee "${REPORT_DIR}/run.log"

          PIPE_RESULTS=("${PIPESTATUS[@]}")

          STAGE_STATUS="${PIPE_RESULTS[0]:-1}"
          TEE_STATUS="${PIPE_RESULTS[1]:-1}"

          set -e

          printf '%s\n' "${STAGE_STATUS}" \
            > "${REPORT_DIR}/stage-exit-code.txt"

          printf '%s\n' "${TEE_STATUS}" \
            > "${REPORT_DIR}/tee-exit-code.txt"

          sha256sum "${REPORT_DIR}/run.log" \
            > "${REPORT_DIR}/checksums.sha256"

          {
            echo "stage_exit_code=${STAGE_STATUS}"
            echo "tee_exit_code=${TEE_STATUS}"
            echo "completed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "${REPORT_DIR}/run-metadata.txt"

          echo
          echo "Documentation-conformance evidence:"
          find "${REPORT_DIR}" -maxdepth 1 -type f -print

          test -s "${REPORT_DIR}/run.log"
          test -s "${REPORT_DIR}/checksums.sha256"
          test -s "${REPORT_DIR}/stage-exit-code.txt"

          if [[ "${TEE_STATUS}" -ne 0 ]]; then
            echo "::error::Failed to retain Stage 13 output"
            exit "${TEE_STATUS}"
          fi

          if [[ "${STAGE_STATUS}" -ne 0 ]]; then
            echo "::error::CI Stage 13 failed with exit code ${STAGE_STATUS}"
            exit "${STAGE_STATUS}"
          fi

          echo "CI Stage 13 completed successfully."

      - name: Show retained evidence
        if: always()
        shell: bash
        run: |
          REPORT_DIR="${RUNNER_TEMP}/documentation-conformance-self-test"

          echo "Evidence directory: ${REPORT_DIR}"

          if [[ -d "${REPORT_DIR}" ]]; then
            find "${REPORT_DIR}" -maxdepth 1 -type f -ls
          else
            echo "::error::Evidence directory does not exist"
            exit 1
          fi

      - name: Retain documentation-conformance self-test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: documentation-conformance-self-test
          path: ${{ runner.temp }}/documentation-conformance-self-test/
          if-no-files-found: error
          retention-days: 90
