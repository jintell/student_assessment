name: Platform CI

on:
  workflow_call:
    secrets:
      ARCHITECTURE_REPOSITORY_TOKEN:
        required: true
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checkout-provenance:
    name: checkout-provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Import trusted GitHub signing key
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_FINGERPRINT="968479A1AFF927E37D1A566BB5690EEEBB952194"

          mkdir -p "$HOME/.gnupg"
          chmod 700 "$HOME/.gnupg"

          gpg --batch --import ci/keys/github-web-flow.gpg

          ACTUAL_FINGERPRINT="$(
            gpg --batch \
                --with-colons \
                --fingerprint B5690EEEBB952194 \
              | awk -F: '$1 == "fpr" { print $10; exit }'
          )"

          if [[ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]]; then
            echo "::error::Unexpected GitHub signing-key fingerprint"
            echo "Expected: $EXPECTED_FINGERPRINT"
            echo "Actual:   $ACTUAL_FINGERPRINT"
            exit 1
          fi

          echo "Trusted GitHub signing key imported successfully."

      - name: Run CI Stage 1
        run: ci/stage-1

  build:
    name: build
    needs: checkout-provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - run: ci/stage-2

  static-analysis:
    name: static-analysis
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - run: ci/stage-3

  stage-4a:
    name: stage-4a
    needs: static-analysis
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout ratified architecture baseline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: jintell/sap_design
          path: architecture-baseline
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.ARCHITECTURE_REPOSITORY_TOKEN }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Run and retain Stage 4a
        shell: bash
        run: |
          mkdir -p build/reports/stage-4a/live
          set -o pipefail
          ./gradlew --no-daemon --console=plain ciStage4a 2>&1 \
            | tee build/reports/stage-4a/live/run.log
          shasum -a 256 build/reports/stage-4a/live/run.log \
            > build/reports/stage-4a/live/checksums.sha256
        env:
          ARCHITECTURE_REPOSITORY: ${{ github.workspace }}/architecture-baseline
      - name: Retain Stage 4a self-test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stage-4a-self-test-result
          path: build/reports/stage-4a/self-test/**
          if-no-files-found: error
          retention-days: 90
      - name: Retain green Stage 4a ratification evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stage-4a-live-ratification
          path: build/reports/stage-4a/live/**
          if-no-files-found: error
          retention-days: 90

  arch-conformance:
    name: arch-conformance
    needs: stage-4a
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - run: ci/stage-4

  unit-tests:
    name: unit-tests
    needs: arch-conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - run: ci/stage-5

  slice-tests:
    name: slice-tests
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - run: ci/stage-7

  docs-conformance:
    name: docs-conformance
    needs: slice-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Checkout ratified architecture baseline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: jintell/sap_design
          path: architecture-baseline
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Run and retain documentation conformance
        shell: bash
        env:
          ARCHITECTURE_REPOSITORY: ${{ github.workspace }}/architecture-baseline
        run: |
          set -uo pipefail

          REPORT_DIR="${RUNNER_TEMP}/documentation-conformance-self-test"

          rm -rf "${REPORT_DIR}"
          mkdir -p "${REPORT_DIR}"

          echo "Running CI Stage 13..."

          # Do not terminate immediately if Stage 13 fails.
          # We must retain its evidence first.
          set +e

          ci/stage-13 2>&1 \
            | tee "${REPORT_DIR}/run.log"

          STAGE_STATUS=${PIPESTATUS[0]}
          TEE_STATUS=${PIPESTATUS[1]}

          set -e

          printf '%s\n' "${STAGE_STATUS}" \
            > "${REPORT_DIR}/stage-exit-code.txt"

          sha256sum "${REPORT_DIR}/run.log" \
            > "${REPORT_DIR}/checksums.sha256"

          echo
          echo "Documentation-conformance evidence:"
          find "${REPORT_DIR}" -type f -maxdepth 1 -print

          test -s "${REPORT_DIR}/run.log"
          test -s "${REPORT_DIR}/checksums.sha256"
          test -s "${REPORT_DIR}/stage-exit-code.txt"

          if [[ "${TEE_STATUS}" -ne 0 ]]; then
            echo "::error::Failed to retain Stage 13 output"
            exit "${TEE_STATUS}"
          fi

          if [[ "${STAGE_STATUS}" -ne 0 ]]; then
            echo "::error::CI Stage 13 failed with exit code ${STAGE_STATUS}"
            exit "${STAGE_STATUS}"
          fi

          echo "CI Stage 13 completed successfully."

      - name: Retain documentation-conformance self-test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: documentation-conformance-self-test
          path: ${{ runner.temp }}/documentation-conformance-self-test/
          if-no-files-found: error
          retention-days: 90