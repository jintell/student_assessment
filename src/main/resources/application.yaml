spring:
  application:
    name: cbt-platform
  config:
    import:
      - optional:configtree:${CBT_DATABASE_SECRETS_PATH:/run/secrets/database/}
      - optional:configtree:${CBT_REDIS_SECRETS_PATH:/run/secrets/redis/}
  flyway:
    enabled: false
cbt:
  migration:
    classification: ${CBT_MIGRATION_CLASSIFICATION}
    connection-allowance: ${CBT_MIGRATION_CONNECTION_ALLOWANCE:10}
    telemetry:
      export-timeout: ${CBT_MIGRATION_TELEMETRY_EXPORT_TIMEOUT:5s}
    session:
      exam-critical-lock-timeout: 250ms
      non-critical-lock-timeout: 2s
      concurrent-index-lock-timeout: 2s
      statement-timeout: 15m
      idle-in-transaction-timeout: 30s
logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-none}] [actorType:%X{actorType:-none}] [actorId:%X{actorId:-none}] [tenantId:%X{tenantId:-none}] [errorCode:%X{errorCode:-none}]"
---
spring:
  config:
    activate:
      on-profile: api
cbt:
  database:
    pools:
      api:
        url: ${CBT_DATABASE_URL}
        username: app_api
        password: ${cbt.database.roles.app-api.password}
        initial-size: 0
        max-size: 6
        max-idle-time: 30m
      exam-path:
        url: ${CBT_DATABASE_URL}
        username: app_api
        password: ${cbt.database.roles.app-api.password}
        initial-size: 0
        max-size: 8
        max-idle-time: 30m
---
spring:
  config:
    activate:
      on-profile: worker
    import:
      - configtree:${CBT_BROKER_SECRETS_PATH:/run/secrets/broker/}
  rabbitmq:
    host: ${CBT_BROKER_HOST}
    port: ${CBT_BROKER_PORT:5671}
    virtual-host: ${CBT_BROKER_VHOST}
    username: ${cbt.broker.username}
    password: ${cbt.broker.password}
    ssl:
      enabled: true
      validate-server-certificate: true
      verify-hostname: true
    listener:
      direct:
        prefetch: 32
      simple:
        prefetch: 32
cbt:
  database:
    pools:
      worker:
        url: ${CBT_DATABASE_URL}
        username: app_worker
        password: ${cbt.database.roles.app-worker.password}
        initial-size: 0
        max-size: 10
        max-idle-time: 30m
---
spring:
  config:
    activate:
      on-profile: pindist
cbt:
  database:
    pools:
      pindist:
        url: ${CBT_DATABASE_URL}
        username: app_pindist
        password: ${cbt.database.roles.app-pindist.password}
        initial-size: 0
        max-size: 5
        max-idle-time: 30m
---
spring:
  config:
    activate:
      on-profile: production
  data:
    redis:
      host: ${CBT_REDIS_HOST}
      port: ${CBT_REDIS_PORT:6379}
      username: ${CBT_REDIS_USERNAME}
      password: ${cbt.redis.password}
      ssl:
        enabled: true
