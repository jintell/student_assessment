spring.profiles.active=worker
spring.autoconfigure.exclude=org.springframework.modulith.runtime.autoconfigure.SpringModulithRuntimeAutoConfiguration,org.springframework.modulith.observability.autoconfigure.ModuleObservabilityAutoConfiguration,org.springframework.modulith.actuator.autoconfigure.ApplicationModulesEndpointConfiguration,org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
spring.flyway.enabled=false
spring.web.resources.add-mappings=false
spring.security.user.name=metrics
spring.security.user.password=${DRILL_METRICS_PASSWORD}
spring.security.user.roles=ACTUATOR
server.port=-1
management.server.port=9091
management.endpoints.enabled-by-default=false
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,prometheus,drill
management.endpoint.health.enabled=true
management.endpoint.prometheus.enabled=true
management.endpoint.drill.enabled=true
cbt.outbox.backlog.interval=5s
cbt.outbox.backlog.maximum-sample-age=15s
cbt.outbox.backlog.query-timeout=2s
cbt.database.pools.worker.url=r2dbc:postgresql://postgres:5432/p722
cbt.database.pools.worker.username=app_worker
cbt.database.pools.worker.password=${DRILL_WORKER_PASSWORD}
cbt.database.pools.worker.initial-size=0
cbt.database.pools.worker.max-size=4
cbt.database.pools.worker.max-idle-time=1m
cbt.database.pools.grading.url=${cbt.database.pools.worker.url}
cbt.database.pools.grading.username=app_worker
cbt.database.pools.grading.password=${DRILL_WORKER_PASSWORD}
cbt.database.pools.grading.initial-size=0
cbt.database.pools.grading.max-size=4
cbt.database.pools.grading.max-idle-time=1m
cbt.database.pools.sweep-lock.url=${cbt.database.pools.worker.url}
cbt.database.pools.sweep-lock.username=app_worker
cbt.database.pools.sweep-lock.password=${DRILL_WORKER_PASSWORD}
cbt.database.pools.sweep-lock.initial-size=0
cbt.database.pools.sweep-lock.max-size=2
cbt.database.pools.sweep-lock.max-idle-time=1m
drill.broker-password=${DRILL_BROKER_PASSWORD}
