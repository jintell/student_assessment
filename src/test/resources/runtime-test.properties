cbt.observability.resource.service-name=cbt-platform
cbt.observability.resource.environment=test
cbt.observability.resource.role=api
cbt.observability.collector.endpoint=http://127.0.0.1:4317
cbt.observability.collector.protocol=GRPC
cbt.observability.collector.tls.enabled=false
cbt.observability.collector.tls.trust-certificate-reference=
cbt.observability.collector.tls.client-certificate-reference=
cbt.observability.collector.tls.client-private-key-reference=
cbt.observability.collector.endpoints.traces=http://127.0.0.1:4317
cbt.observability.collector.endpoints.metrics=http://127.0.0.1:4317
cbt.observability.collector.endpoints.logs=http://127.0.0.1:4317
cbt.observability.sampling.exam-entry-head-ratio=1.0
cbt.observability.sampling.grading-head-ratio=1.0
cbt.observability.sampling.standard-export-ratio=1.0
cbt.observability.sampling.standard-tail-ratio=0.10
cbt.observability.redaction.permitted-key-fields=policy_key
cbt.observability.export.timeout=100ms
cbt.observability.export.queues.traces.capacity=256
cbt.observability.export.queues.traces.batch-size=64
cbt.observability.export.queues.traces.item-max-age=30s
cbt.observability.export.queues.metrics.capacity=256
cbt.observability.export.queues.metrics.batch-size=64
cbt.observability.export.queues.metrics.item-max-age=30s
cbt.observability.export.queues.logs.capacity=256
cbt.observability.export.queues.logs.batch-size=64
cbt.observability.export.queues.logs.item-max-age=30s
cbt.observability.trace.max-continuation-age=1h
cbt.observability.metric-catalogues.ceilings.active-sessions=500
cbt.observability.metric-catalogues.ceilings.replicas=12
cbt.observability.metric-catalogues.ceilings.queues=32
cbt.observability.metric-catalogues.ceilings.roles=14
cbt.observability.metric-catalogues.ceilings.policies=64
cbt.observability.metric-catalogues.ceilings.shards=32
cbt.observability.metric-catalogues.ceilings.routes=100
cbt.observability.metric-catalogues.ceilings.slices=160
