title = "cbt-platform secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Generated outputs, local tool caches, public keys, and detached signatures"
paths = [
  '''(^|/)\.git/''',
  '''(^|/)\.gradle/''',
  '''(^|/)\.idea/''',
  '''(^|/)build/''',
  '''^ci/trusted-[^/]+\.asc$''',
  '''^ci/architecture-ratification\.[^/]+\.sig$'''
]

[[allowlists]]
description = "Synthetic dataset null-frequency directive"
condition = "AND"
targetRules = ["generic-api-key"]
regexes = ['''^null-frequency=0\.10$''']
paths = [
  '''(^|/)migration/volumetrics\.yaml$''',
  '''(^|/)migration-verify/src/main/java/org/meldtech/migrationverify/measure/DeterministicDatasetGenerator\.java$'''
]
