formatVersion: 1
entries:
  - name: audit-checkpoint-and-epoch-root-signing-key
    scope: per-environment
    type: asymmetric-kms-key
    privateKeyExportable: false
    keyReferenceEnvironmentVariable: CBT_AUDIT_SIGNING_KEY_REFERENCE
    signWorkloadIdentity: cbt-audit-sealer
    permittedOperations:
      - sign
      - get-public-key
      - describe-key
    rotation:
      period: P1Y
      onSuspectedDisclosure: true
      onSignerOffboarding: true
      retainOldPublicKeyVersions: P5Y
    distinctFrom:
      - pin-retrieval-kek
      - token-signing-keys
      - notification-provider-credentials
