openapi: 3.1.0
info:
  title: Audit compliance API
  version: 1.0.0
paths:
  /api/v1/audit-events:
    get:
      operationId: audit.getComplianceAuditEvents
      parameters:
        - {name: occurredFrom, in: query, schema: {type: string, format: date-time}}
        - {name: occurredTo, in: query, schema: {type: string, format: date-time}}
        - {name: entityType, in: query, schema: {type: string}}
        - {name: entityId, in: query, schema: {type: string}}
        - {name: eventType, in: query, schema: {type: string}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        '200':
          description: Tenant-scoped immutable audit event page
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor, hasMore]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/AuditEventItem'}}
                  nextCursor: {type: string}
                  hasMore: {type: boolean}
components:
  schemas:
    AuditEventItem:
      type: object
      additionalProperties: false
      required: [auditEventId, eventType, entityType, entityId, actorType, actorId, occurredAt, correlationId, retentionClass, shardId, sequence]
      properties:
        auditEventId: {type: string, format: uuid}
        eventType: {type: string}
        entityType: {type: string}
        entityId: {type: string}
        actorType: {type: string}
        actorId: {type: string}
        occurredAt: {type: string, format: date-time}
        correlationId: {type: string}
        retentionClass: {type: string}
        shardId: {type: integer, minimum: 0}
        sequence: {type: integer, minimum: 1}
